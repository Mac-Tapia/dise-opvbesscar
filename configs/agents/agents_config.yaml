agents:
  sac:
    name: Soft Actor-Critic
    type: off-policy
    enabled: true
  ppo:
    name: Proximal Policy Optimization
    type: on-policy
    enabled: true
  a2c:
    name: Advantage Actor-Critic
    type: on-policy
    enabled: true
training:
  episodes: 50
  max_timesteps: 438000
  evaluation_frequency: 1
  checkpoint_frequency: 1000
environment:
  episode_length: 8760
  time_step_minutes: 60
reward_weights:
  # Pesos v8.1 — tres objetivos OE3 explícitos (idénticos SAC/PPO/A2C)
  # Suma: 0.15+0.40+0.25+0.10+0.05+0.03+0.02 = 1.00
  direct_co2: 0.20        # OE3-1: CO2 directa — reducción ICE→EV electrificación
  indirect_co2: 0.30      # OE3-2: CO2 indirecta — minimizar grid import diesel
  ev_satisfaction: 0.35   # OE3-3: satisfaccion/cantidad carga EV (motos+mototaxis)
  bess_solar_timing: 0.07 # regla op: BESS carga solar(6-18h), NO diesel nocturno
  solar: 0.05             # autoconsumo PV
  grid_stability: 0.03    # estabilidad red (suavizado rampas)
  cost: 0.02              # costo OSINERGMIN HP/HFP (secundario)
  # OE3: Seleccionar agente IA para la gestion de recarga de motos y mototaxis
  # electricas que contribuye cuantificablemente a la reduccion de CO2 en Iquitos.
infrastructure:
  solar_capacity_kwp: 4162.0
  bess_capacity_kwh: 2000
  bess_power_kw: 400.0
  bess_min_soc_percent: 20.0
  num_chargers: 19
  num_sockets: 38
  charger_power_kw_per_socket: 7.4
  bess_capacity_nominal_kwh: 2000.0
  chargers_total: 19
  sockets_total: 38
  motos_daily: 270
  mototaxis_daily: 39
co2_context:
  region: Iquitos
  country: Peru
  grid_co2_intensity: 0.4521
data:
  solar: data/oe2/Generacionsolar/pv_generation_citylearn2024.csv
  bess: data/oe2/bess/bess_ano_2024.csv
  chargers: data/oe2/chargers/chargers_ev_ano_2024_v3.csv
  mall_demand: data/oe2/demandamallkwh/demandamallhorakwh.csv
outputs:
  checkpoints_dir: outputs/checkpoints
  agents_dir: outputs/agents
  results_dir: outputs/results
