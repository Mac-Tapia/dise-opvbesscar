ppo:
  name: Proximal Policy Optimization
  description: On-policy agent with clipped objective (SB3 PPO + VecNormalize)
  # Hiperparámetros sincronizados con train_ppo_citylearn.py PPO_HYPERPARAMS v10.0
  # Refs: Engstrom et al 2020, Andrychowicz et al 2021, Schulman et al 2017
  training:
    episodes: 50
    total_timesteps: 438000       # 50 ep × 8760 h/año
    checkpoint_every_steps: 8760  # guardar cada episodio completo
    checkpoint_dir: checkpoints/PPO_CityLearn
  hyperparams:
    n_steps: 4096          # ~46% del episodio (mejor que 8760=100%, reduce varianza)
    batch_size: 256        # GPU; 128 en CPU
    n_epochs: 10           # crítico para convergencia (3 epochs → aprendizaje lento)
    gamma: 0.88            # reducido: evita retornos explosivos en episodios 8760 steps
    gae_lambda: 0.92       # reduce varianza en horizontes largos (Schulman 2017 Fig.4)
    clip_range: 0.2
    ent_coef: 0.02         # mayor exploración para reward multi-objetivo 5 componentes
    vf_coef: 0.5
    max_grad_norm: 0.5
    learning_rate: linear_1e-4_to_0  # schedule lineal 1e-4→0 (Engstrom 2020)
    target_kl: 0.02        # detiene update si KL>0.02 (guardian activo con 10 epochs)
  network:
    # Actor: [256, 256, 128] | Critic: [512, 512, 256]
    pi: [256, 256, 128]
    vf: [512, 512, 256]
    activation: tanh       # Tanh mejor que ReLU para PPO (bounded outputs)
    ortho_init: true       # inicialización ortogonal (Engstrom 2020)
  normalization:
    normalize_observations: true
    normalize_rewards: true
    clip_obs: 10.0
    clip_reward: 10.0
  multi_objective_weights:
    # Pesos v7.4 — tres objetivos OE3 explícitos (idénticos SAC/PPO/A2C)
    # Suma: 0.15+0.40+0.25+0.10+0.05+0.03+0.02 = 1.00
    direct_co2: 0.25        # OE3-1: CO2 directa — reducción ICE→EV electrificación
    indirect_co2: 0.30      # OE3-2: CO2 indirecta — minimizar grid import diesel
    ev_satisfaction: 0.25   # OE3-3: satisfacción/cantidad carga EV (motos+mototaxis)
    bess_solar_timing: 0.10 # regla op: BESS carga solar(6-18h), NO diesel nocturno
    solar: 0.05             # autoconsumo PV
    grid_stability: 0.03    # estabilidad red (suavizado rampas)
    cost: 0.02              # costo OSINERGMIN HP/HFP (secundario)
  device: cuda          # detectado automáticamente (CUDA si disponible)
  verbose: 1
  seed: 42
performance:
  avg_reduccion_co2_pct: 59.23   # run abril 2026 (50 eps, CUDA)
  validation_mean_reward: -859.73
  training_time_hours: 0.34
  device_used: cuda
tariff:
  hp_soles_kwh: 0.45
  hfp_soles_kwh: 0.28
  difference_soles_kwh: 0.17
  factor_hp_hfp: 1.607
