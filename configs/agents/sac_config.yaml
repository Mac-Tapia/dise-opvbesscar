sac:
  name: Soft Actor-Critic
  description: Off-policy actor-critic agent with entropy regularization
  training:
    episodes: 50
    total_timesteps: 438000
    # [FIX v1] 5e-4 → 1e-4 (grad_norm explosiva 132.93>10 observada en entrenamiento)
    # Haarnoja 2018 (arXiv:1801.01290) std=3e-4; Engstrom 2020 (arXiv:2005.12729) recomienda
    # bajar LR en problemas de alta dimension (>20D acciones). Para 39D: 1e-4 optimo.
    learning_rate: 1e-4
    # [FIX] 400000 → 100000: buffer de 1M (paper) excesivo para 438k steps totales;
    # 100k mantiene los ultimos ~11 episodios completos (8760 steps cada uno).
    # Raffin 2022 (arXiv:2005.05719): 100k-300k suficiente para SAC con <1M steps.
    buffer_size: 100000
    # [FIX v3] 1000 → 5000: warmup con buffer mas diverso para espacio de accion 39D.
    # Andrychowicz 2020 (arXiv:2006.05990): warmup debe cubrir ~5x batch x dim acciones.
    learning_starts: 5000
    # [FIX] 128 → 256: estandar SAC en GPU (Haarnoja 2018, Raffin 2022).
    batch_size: 256
    # [FIX] target_entropy = -dim(action_space) = -(38 sockets + 1 BESS) = -39.0
    # Haarnoja 2018 (Sec.5): H* = -dim(A) como heuristica para control continuo.
    # Haarnoja 2019 (arXiv:1812.05905): confirma target con auto-alpha Lagrangiano.
    target_entropy: -39.0
    gamma: 0.99
    tau: 0.005
  entropy:
    ent_coef: auto
    ent_coef_init: 0.5
    ent_coef_lr: 1e-3
    ent_coef_min: 0.001   # Colapso REAL: SB3 SAC converge a 0.005-0.01 con target_entropy=-39 (NORMAL)
    ent_coef_max: 1.0
  network:
    # [FIX] [384,384] → [256,256]: arquitectura estandar SAC (Haarnoja 2018, Raffin 2022 CoRL).
    # Para 39D acciones con obs ~394D, [256,256] es suficientemente expresivo
    # sin sobreajustar en 438k steps de entrenamiento total.
    hidden_sizes:
    - 256
    - 256
    activation: relu
  stability:
    clip_gradients: true
    # [FIX v3] 10.0 → 5.0: menos restrictivo que 1.0 (que bloqueaba actor 39D),
    # pero conservador vs sin clipping. Engstrom 2020 (ICLR): gradient clipping
    # impacta fundamentalmente el comportamiento del agente en problemas de alta dim.
    # Andrychowicz 2020: clip agresivo (<1.0 off-policy) impide politicas diversas.
    max_grad_norm: 5.0
    critic_max_grad_norm: 1.0
    critic_loss_scale: 0.1
    q_target_clip: 10.0
  multi_objective_weights:
    direct_co2: 0.35      # P1: Direct CO2 Minimization (combustible vehicular evitado)
    indirect_co2: 0.30   # P2: Indirect CO2 Minimization (grid import termico)
    ev_satisfaction: 0.25 # P3: EV Satisfaction (SOC objetivo)
    solar: 0.05           # P4: Solar Self-Consumption
    grid_stability: 0.05  # P5: Grid Stability
  tariffs_osinergmin_usd_per_kwh:
    generation_solar: 0.1
    storage_bess: 0.06
    distribution_ev_charge: 0.12
    integrated_tariff: 0.28
  dispatch_hierarchy:
    description: Strict day/night dispatch rules with exponential penalties
    day_rules:
      solar_to_ev_target_pct: 90
      solar_to_ev_penalty: -0.8
      bess_priority_penalty: -0.4
    night_rules:
      bess_to_ev_exclusive: true
      bess_over_grid_penalty: -0.9
      bess_soc_min_closure: 0.2
      bess_soc_penalty_closure: -0.95
  soc_modulation:
    description: Aggressive daytime factors to reach 2,500-3,073 EV events/day target
    soc_critical:
      daytime:
      - 1.8
      - 2.2
      nighttime:
      - 1.5
      - 1.8
    soc_normal:
      daytime:
      - 1.3
      - 1.6
      nighttime:
      - 1.1
      - 1.35
    soc_high:
      daytime:
      - 0.95
      - 1.25
      nighttime:
      - 0.85
      - 1.1
  device: auto
  use_amp: true
  verbose: 1
  log_interval: 500
  checkpoint_freq_steps: 1000
  save_final: true
  seed: 42
performance:
  expected_co2_reduction: 0.808
  expected_solar_utilization: 0.798
  expected_ev_satisfaction: 1.0
  expected_bess_soc_avg: 0.85
  motos_per_day_avg: 270
  mototaxis_per_day_avg: 39
  annual_ev_demand_kwh: 352887
  cost_savings_usd: 30530
  training_time_hours: 6.5
tariff:
  hp_soles_kwh: 0.45
  hfp_soles_kwh: 0.28
  difference_soles_kwh: 0.17
  factor_hp_hfp: 1.607
rewards:
  hp_weight: 0.4
  hfp_weight: 0.15
