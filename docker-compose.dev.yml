# docker-compose.dev.yml
# Stack operativo A2C completo desde cero — sin nginx (acceso directo puerto 8000)
#
# Uso:
#   docker compose -f docker-compose.dev.yml --env-file .env.local up -d --build
#   docker compose -f docker-compose.dev.yml logs -f a2c-api

name: pvbesscar-dev

services:

  # ── API FastAPI + A2C inference ───────────────────────────────
  a2c-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    image: pvbesscar-api:dev
    container_name: a2c-api
    ports:
      - "8000:8000"
    environment:
      API_KEY:         ${API_KEY:?API_KEY requerida}
      MONGODB_URL:     mongodb://pvbesscar:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/pvbesscar?authSource=admin
      MONGODB_DB:      pvbesscar
      CHECKPOINT_PATH: /app/checkpoints/A2C_CityLearn/a2c_final
      CORS_ORIGINS:    "*"
      MAX_CONCURRENT:  "2"
      PYTHONPATH:      /app/src:/app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - api_outputs:/app/outputs
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,json,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=10); d=json.loads(r.read()); sys.exit(0 if d.get('model_ready') else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── MongoDB ───────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: pvbesscar-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: pvbesscar
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?password requerida}
      MONGO_INITDB_DATABASE:      pvbesscar
    volumes:
      - mongodb_data:/data/db
      - ./deploy/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  mongodb_data:
  api_outputs:
